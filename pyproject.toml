[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "telebirr-audio-bot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["python-telegram-bot>=22,<23", "httpx>=0.27,<1", "beautifulsoup4>=4.12,<5", "Pillow>=10,<13", "pytesseract>=0.3.13,<1", "python-dotenv>=1,<2"]
[tool.setuptools.packages.find]
include = ["app*"]
